<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/App.Logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Lethal Lifts is a workout tracker for lifters. Build training programs, log every set, and track your strength and body weight over time." />
    <title>Lethal Lifts Pro</title>
  </head>
  <body class="bg-neutral-950 text-white m-0 p-0">
    <noscript>
      <h1>Lethal Lifts</h1>
      <p>Lethal Lifts is a workout tracker for lifters. Build training programs, log every set, and track your strength and body weight over time.</p>
      <a href="/privacy">Privacy Policy</a>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // If the app's files never arrive, nothing above can show a message, so say something here.
      // Styled inline because the stylesheet may be missing too.
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          root.innerHTML = '<div style="min-height:100vh;box-sizing:border-box;padding:32px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:#0a0a0a;color:#fff;font-family:system-ui,sans-serif"><h1 style="font-size:24px;margin:0 0 12px">Lethal Lifts couldn\'t load</h1><p style="color:#a3a3a3;max-width:320px;line-height:1.5;margin:0">This device doesn\'t have the latest app files yet. Connect to the internet and open the app again.</p></div>';
        }
      }, 6000);

      // 1. Vite fallback: If an old JS chunk is missing from the server, auto-refresh to get the new ones!
      window.addEventListener('vite:preloadError', (event) => {
        event.preventDefault();
        window.location.reload(); 
      });

      // 2. Register the service worker to unlock the PWA Install button and Offline Mode
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('Service Worker registration failed: ', err);
          });
        });
      }
    </script>
  </body>
</html>
